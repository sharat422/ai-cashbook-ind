pluginManagement { includeBuild("../node_modules/@react-native/gradle-plugin") }
plugins { id("com.facebook.react.settings") }
extensions.configure(com.facebook.react.ReactSettingsExtension){ ex -> ex.autolinkLibrariesFromCommand() }
rootProject.name = 'AISmartCashBook'
include ':app'
includeBuild('../node_modules/@react-native/gradle-plugin')

// react-native-config is linked MANUALLY (not via autolinking). The community
// CLI reports its Android platform as null in this toolchain, and forcing it back
// on through react-native.config.js proved unreliable in CI (Codemagic) — the
// `:react-native-config` project intermittently failed to register, breaking
// `apply from: project(':react-native-config')…/dotenv.gradle` in app/build.gradle.
// Registering it explicitly here is deterministic on every machine. The native
// module is added by hand in MainApplication.kt, and the app depends on it in
// app/build.gradle.
include ':react-native-config'
project(':react-native-config').projectDir =
    new File(rootProject.projectDir, '../node_modules/react-native-config/android')
