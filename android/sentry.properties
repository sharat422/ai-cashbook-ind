# Sentry native SDK config (read by the Sentry Gradle plugin / sentry-cli).
#
# Fill in defaults.org / defaults.project AFTER creating the project at
# https://sentry.io (organizations -> your org slug, projects -> project slug).
# The auth token is NEVER committed here: set SENTRY_AUTH_TOKEN as an
# encrypted Codemagic environment variable (same place as the keystore group).
# sentry-cli also honors the SENTRY_AUTH_TOKEN env var natively.
defaults.org=your-sentry-org
defaults.project=bolcash-android
# Do not put auth.token here. CI injects SENTRY_AUTH_TOKEN from env.
