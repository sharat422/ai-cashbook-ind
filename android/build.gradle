buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 34
        ndkVersion = "26.1.10909125"
        kotlinVersion = "1.9.24"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// react-native-audio-recorder-player pins its Kotlin jvmTarget to 1.8 but sets no
// Java compileOptions, so its Java compiles at 17 under this toolchain — Gradle
// rejects the pair ("Inconsistent JVM-target compatibility: Java 17 / Kotlin 1.8").
// Bump ONLY its Kotlin target to 17 so it matches its Java.
//
// This is deliberately scoped to that one module: the other Kotlin libraries here
// (reanimated, screens, netinfo, html-to-pdf) pin BOTH Java and Kotlin to 1.8 and
// are already internally consistent — blanket-forcing Kotlin to 17 would give
// them Java 1.8 / Kotlin 17, the same error in reverse.
//
// Configured lazily via configureEach (NOT afterEvaluate): the React Native
// root-project plugin evaluates some subprojects eagerly, so afterEvaluate would
// throw "project is already evaluated". configureEach also runs at task
// realization — after the library sets its own 1.8 — so this override wins.
subprojects { sp ->
    if (sp.name == "react-native-audio-recorder-player") {
        sp.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
            kotlinOptions {
                jvmTarget = "17"
            }
        }
    }
}
