# Render Blueprint — TWO environments for the FastAPI backend:
#
#   • staging     smart-cashbook-api        → https://smart-cashbook-api.onrender.com
#                 Testing playground. DEBUG=true so testers log in with OTP 123456.
#                 Its own throwaway Postgres. This is what current TestFlight builds hit.
#
#   • production  smart-cashbook-api-prod   → https://smart-cashbook-api-prod.onrender.com
#                 Real users. DEBUG=false (real auth — see note), Singapore region
#                 (closer to India), its own separate Postgres so test data never
#                 mixes with production data.
#
# Each environment has an INDEPENDENT JWT_SECRET, so a token minted in staging is
# invalid in production and vice-versa. Secrets (`sync: false`) are set per-service
# in the Render dashboard, never in git. See PRODUCTION_SETUP.md.
#
# Apply/refresh: Render → New + → Blueprint → this repo → Apply (manages BOTH envs).
# Free web instances sleep after ~15 min idle; move each to a paid plan for
# always-on before real launch.

databases:
  - name: smart-cashbook-db-staging
    plan: free
    databaseName: cashbook
    user: cashbook
  - name: smart-cashbook-db-prod
    plan: free
    databaseName: cashbook
    user: cashbook
    region: singapore

services:
  # =========================================================================
  # STAGING — keeps the existing URL (smart-cashbook-api.onrender.com)
  # =========================================================================
  - type: web
    name: smart-cashbook-api
    runtime: python
    rootDir: backend
    plan: free
    healthCheckPath: /health
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE_MINUTES
        value: "43200"
      - key: DATABASE_URL
        fromDatabase:
          name: smart-cashbook-db-staging
          property: connectionString
      # Staging: master OTP ON so testers can log in with 123456 (no SMS needed).
      - key: DEBUG
        value: "true"
      - key: MASTER_OTP
        value: "123456"
      - key: CORS_ORIGINS
        value: "*"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-opus-4-8
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_API_VERSION
        value: v21.0
      - key: WHATSAPP_DEFAULT_COUNTRY_CODE
        value: "91"

  # =========================================================================
  # PRODUCTION — new URL (smart-cashbook-api-prod.onrender.com), Singapore region
  # =========================================================================
  - type: web
    name: smart-cashbook-api-prod
    runtime: python
    rootDir: backend
    plan: free            # ⬆ bump to "starter" for always-on before launch
    region: singapore     # low latency to India
    healthCheckPath: /health
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE_MINUTES
        value: "43200"
      - key: DATABASE_URL
        fromDatabase:
          name: smart-cashbook-db-prod
          property: connectionString
      # Production posture: real auth. ⚠️ With DEBUG=false the master OTP is
      # DISABLED, so login requires a real SMS-OTP provider to be wired first.
      # For a controlled India test BEFORE SMS is wired, temporarily set
      # DEBUG=true + MASTER_OTP in the Render dashboard for THIS service only.
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        value: "*"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-opus-4-8
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_API_VERSION
        value: v21.0
      - key: WHATSAPP_DEFAULT_COUNTRY_CODE
        value: "91"
