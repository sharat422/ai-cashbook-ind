name: Keep backend awake

# Pings the Render backend so the free-tier instance doesn't spin down after
# 15 min idle (which causes a ~30-60s cold start on the next app launch).
# Runs on a schedule and can also be triggered manually from the Actions tab.
#
# Notes:
# - GitHub cron is best-effort and is often delayed 5-15 min under load, so at
#   */10 a single delayed/skipped run can exceed Render's 15 min idle timeout and
#   let the instance sleep. Pinging every 5 min gives enough attempts that at
#   least one reliably lands inside the window.
# - Keeping a free web service always awake uses ~750 of Render's 750 free
#   instance-hours/month (i.e. the whole allowance for one service). Disable this
#   workflow (or move to a paid plan) if you run other free services or approach
#   the limit.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          echo "Pinging backend at $(date -u)"
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 \
            https://smart-cashbook-api.onrender.com/health)
          echo "HTTP $code"
          # 200 = awake. Any response at all means the instance is up; only a
          # hard failure (000) should fail the job.
          test "$code" != "000"
