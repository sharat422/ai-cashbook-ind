name: Cashbook Tests

on:
  push:
    branches: [dev, main, feat/cashbook-production-hardening]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: TypeScript and Jest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run tsc
      - run: npm test -- --ci --runInBand

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q

  backend-postgres:
    name: Backend tests (PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cashbook_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Disposable DB whose name contains "test" (conftest refuses anything else).
      # CASHBOOK_TEST_DATABASE_URL steers the pytest harness; DATABASE_URL steers
      # the app/reconcile script. Both point at the same throwaway Postgres.
      CASHBOOK_TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/cashbook_test
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/cashbook_test
      DEBUG: 'true'
      MASTER_OTP: '123456'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      # Full suite against real Postgres — exercises the actual dialect and the
      # concurrency semantics SQLite can't reproduce. (pytest drops all tables on
      # teardown, so the reconcile step below recreates the schema first.)
      - run: python -m pytest -q
      # Read-only data reconciliation must parse and run clean on Postgres.
      - name: Reconciliation report (read-only)
        run: |
          python -c "import app.models; from app.database import Base, engine; Base.metadata.create_all(bind=engine)"
          python -m scripts.reconcile
