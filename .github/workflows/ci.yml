name: CI

# The single test gate for the repo (formerly split across ci.yml + tests.yml).
# Every job here must stay green on a healthy commit: branch protection and
# Render's "deploy after checks pass" both treat any failing check as a blocker.

on:
  push:
    branches: [dev, main, feat/cashbook-production-hardening]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: TypeScript and Jest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Type-check
        run: npm run tsc

      - name: Run Jest tests
        run: npm test -- --ci --runInBand

      - name: Check translations
        run: npm run i18n:check

  lint:
    name: ESLint (temporary non-blocking)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      # The repository has known lint errors. continue-on-error is on the STEP,
      # not the job, so problems still show as annotations but the check itself
      # reports success and doesn't block deploys. Remove it once lint is clean.
      - name: Run ESLint
        continue-on-error: true
        run: npm run lint

  backend:
    name: FastAPI pytest (SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend and test dependencies
        run: python -m pip install -r requirements-dev.txt

      # Tests deliberately run without provider secrets and exercise the
      # application's offline/fallback paths.
      - name: Run pytest
        env:
          DATABASE_URL: sqlite:///./ci-cashbook.db
          JWT_SECRET: ci-only-not-for-production
          DEBUG: 'true'
          MASTER_OTP: '123456'
        run: python -m pytest -q

  backend-postgres:
    name: FastAPI pytest (PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cashbook_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Disposable DB whose name contains "test" (conftest refuses anything else).
      # CASHBOOK_TEST_DATABASE_URL steers the pytest harness; DATABASE_URL steers
      # the app/reconcile script. Both point at the same throwaway Postgres.
      CASHBOOK_TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/cashbook_test
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/cashbook_test
      JWT_SECRET: ci-only-not-for-production
      DEBUG: 'true'
      MASTER_OTP: '123456'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend and test dependencies
        run: python -m pip install -r requirements-dev.txt

      # Production runs on Postgres: this exercises the real dialect (types,
      # foreign keys, concurrency) that SQLite silently tolerates.
      - name: Run pytest
        run: python -m pytest -q

      # Read-only data reconciliation must parse and run clean on Postgres.
      # (pytest drops all tables on teardown, so recreate the schema first.)
      - name: Reconciliation report (read-only)
        run: |
          python -c "import app.models; from app.database import Base, engine; Base.metadata.create_all(bind=engine)"
          python -m scripts.reconcile
