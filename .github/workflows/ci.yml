name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: TypeScript and Jest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Type-check
        run: npm run tsc

      - name: Run Jest tests
        run: npm test -- --ci --runInBand

      - name: Check translations
        run: npm run i18n:check

  lint:
    name: ESLint (temporary non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      # The repository currently has 31 lint errors. Remove continue-on-error
      # from this job after those errors are fixed.
      - name: Run ESLint
        run: npm run lint

  backend:
    name: FastAPI pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend and test dependencies
        run: python -m pip install -r requirements-dev.txt

      # Tests deliberately run without provider secrets and exercise the
      # application's offline/fallback paths.
      - name: Run pytest
        env:
          DATABASE_URL: sqlite:///./ci-cashbook.db
          JWT_SECRET: ci-only-not-for-production
          DEBUG: 'true'
          MASTER_OTP: '123456'
        run: python -m pytest -q
