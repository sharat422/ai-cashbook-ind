name: Android

on:
  push:
    branches: [dev, main]
    paths:
      - 'android/**'
      - 'src/**'
      - 'App.tsx'
      - 'index.js'
      - 'package.json'
      - 'package-lock.json'
      - '.env.example'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [dev, main]
    paths:
      - 'android/**'
      - 'src/**'
      - 'App.tsx'
      - 'index.js'
      - 'package.json'
      - 'package-lock.json'
      - '.env.example'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      release:
        description: Build a signed Play Store AAB
        required: true
        type: boolean
        default: false
      backend:
        description: Backend baked into the mobile build
        required: true
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ inputs.release && 'Signed AAB' || 'Debug APK' }}
    runs-on: ubuntu-latest
    env:
      STAGING_API_URL: https://smart-cashbook-api.onrender.com
      PRODUCTION_API_URL: https://smart-cashbook-api-prod.onrender.com

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Create build environment
        shell: bash
        run: |
          if [[ "${{ inputs.backend }}" == "production" ]]; then
            api_url="$PRODUCTION_API_URL"
          else
            api_url="$STAGING_API_URL"
          fi

          cp .env.example .env
          sed -i "s|^API_BASE_URL=.*|API_BASE_URL=$api_url|" .env
          echo "Building against $api_url"

      - name: Prepare Gradle wrapper
        run: chmod +x android/gradlew

      - name: Run Android unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug APK
        if: ${{ !inputs.release }}
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Validate Android signing secrets
        if: ${{ inputs.release }}
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          : "${KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64}"
          : "${STORE_PASSWORD:?Missing ANDROID_KEYSTORE_PASSWORD}"
          : "${KEY_ALIAS:?Missing ANDROID_KEY_ALIAS}"
          : "${KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD}"

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo 'RELEASE_STORE_FILE=upload-keystore.jks'
            echo "RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
            echo "RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } > android/keystore.properties

      - name: Build signed Play Store AAB
        if: ${{ inputs.release }}
        working-directory: android
        run: |
          ./gradlew bundleRelease --no-daemon --stacktrace \
            -PversionCodeOverride="${{ github.run_number }}" \
            -PversionNameOverride="1.0.${{ github.run_number }}"

      - name: Verify AAB signature
        if: ${{ inputs.release }}
        shell: bash
        run: |
          aab="$(find android/app/build/outputs/bundle/release -name '*.aab' -print -quit)"
          test -n "$aab"
          jarsigner -verify "$aab"

      - name: Upload debug APK
        if: ${{ !inputs.release }}
        uses: actions/upload-artifact@v4
        with:
          name: ai-smart-cashbook-debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed AAB and mapping
        if: ${{ inputs.release }}
        uses: actions/upload-artifact@v4
        with:
          name: ai-smart-cashbook-play-${{ github.run_number }}
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing files
        if: ${{ always() && inputs.release }}
        shell: bash
        run: |
          rm -f android/app/upload-keystore.jks android/keystore.properties
