name: Payment reminders

# Sends the owners' automatic payment reminders that are due today (the rules in
# the app: a promise coming due, dues overdue by N days): each due retailer who
# opted in to WhatsApp statements gets their statement (backend/app/reminders.py).
# The backend keeps to one WhatsApp message per retailer a day and 9 a.m.–8 p.m.
# IST, so a repeated run sends nothing twice; the second run covers a cold start.
#
# Needs repository secrets CRON_SECRET_STAGING / CRON_SECRET_PROD equal to the
# backend's CRON_SECRET on each service (the same ones as statement-schedules.yml).
# Without them the step is skipped.
on:
  schedule:
    - cron: '37 4,10 * * *'   # 10:07 a.m. and 4:07 p.m. IST
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Staging
        env:
          SECRET: ${{ secrets.CRON_SECRET_STAGING }}
        if: env.SECRET != ''
        run: |
          curl -fsS --max-time 120 -X POST -H "X-Cron-Secret: $SECRET" \
            https://smart-cashbook-api.onrender.com/api/v1/cron/reminders
      - name: Production
        env:
          SECRET: ${{ secrets.CRON_SECRET_PROD }}
        if: env.SECRET != ''
        run: |
          curl -fsS --max-time 120 -X POST -H "X-Cron-Secret: $SECRET" \
            https://ai-cashbook-ind.onrender.com/api/v1/cron/reminders
